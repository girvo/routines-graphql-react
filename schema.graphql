scalar File
scalar DateTime
scalar NonNegativeInt

directive @skipAuth on FIELD_DEFINITION
directive @authenticated on FIELD_DEFINITION

interface Node {
  id: ID!
}

enum DayOfWeek {
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
  SUNDAY
}

enum DaySection {
  MORNING
  MIDDAY
  EVENING
}

type Query {
  node(id: ID!): Node
  me: User!

  # Get today's routine (or specific date)
  dailyRoutine(date: DateTime): DailyRoutinePayload!

  weeklySchedule: WeeklySchedulePayload!

  # The reorderable Task list for one day/section, independent of any date.
  daySectionSlots(dayOfWeek: DayOfWeek!, section: DaySection!): DaySectionSlots!
  tasks(
    first: NonNegativeInt
    after: String
    titleSearch: String
  ): TaskConnection!

  taskCompletions(
    first: NonNegativeInt
    after: String
    startDate: DateTime
    endDate: DateTime
  ): TaskCompletionConnection!

  hello: String! @skipAuth
}

type Mutation {
  createTask(title: String!, icon: String): CreateTaskPayload
  updateTask(input: UpdateTaskInput!): UpdateTaskPayload
  deleteTask(taskId: ID!): DeleteTaskPayload

  createRoutineSlot(input: CreateRoutineSlotInput!): CreateRoutineSlotPayload
  deleteRoutineSlot(routineSlotId: ID!): DeleteRoutineSlotPayload

  completeRoutineSlot(dailyTaskInstanceId: ID!): CompleteRoutineSlotPayload
  uncompleteRoutineSlot(dailyTaskInstanceId: ID!): UncompleteRoutineSlotPayload

  registerPushSubscription(
    input: RegisterPushSubscriptionInput!
  ): RegisterPushSubscriptionPayload
  removePushSubscription(endpoint: String!): RemovePushSubscriptionPayload
  sendTestPush(endpoint: String!): SendTestPushPayload
}

type User implements Node {
  id: ID!
  email: String!
  name: String!
  initials: String!
  createdAt: DateTime!
  pushSubscriptions: [PushSubscription!]!
  morningReminderEnabled: Boolean!
}

type Task implements Node {
  id: ID!
  title: String!
  icon: String
  createdAt: DateTime!

  slots(first: NonNegativeInt, after: String): RoutineSlotConnection!

  completions(
    first: NonNegativeInt
    after: String
    startDate: DateTime
    endDate: DateTime
  ): TaskCompletionConnection!
}

type RoutineSlot implements Node {
  id: ID!
  task: Task!
  dayOfWeek: DayOfWeek!
  section: DaySection!
  position: NonNegativeInt!
  createdAt: DateTime!
}

type TaskCompletion implements Node {
  id: ID!
  routineSlot: RoutineSlot!
  completedAt: DateTime!
  dailyTaskInstance: DailyTaskInstance!
}

type PushSubscription implements Node {
  id: ID!
  endpoint: String!
  platform: String
  createdAt: DateTime!
  lastSeenAt: DateTime
}

type DailyRoutinePayload {
  date: DateTime!
  dayOfWeek: DayOfWeek!
  morning(first: NonNegativeInt, after: String): DailyTaskInstanceConnection!
  midday(first: NonNegativeInt, after: String): DailyTaskInstanceConnection!
  evening(first: NonNegativeInt, after: String): DailyTaskInstanceConnection!
}

type DailyTaskInstance implements Node {
  id: ID!
  routineSlot: RoutineSlot!
  completion: TaskCompletion
}

type WeeklySchedulePayload {
  monday: DaySchedule!
  tuesday: DaySchedule!
  wednesday: DaySchedule!
  thursday: DaySchedule!
  friday: DaySchedule!
  saturday: DaySchedule!
  sunday: DaySchedule!
}

type DaySchedule {
  dayOfWeek: DayOfWeek!
  morning(first: NonNegativeInt, after: String): RoutineSlotConnection!
  midday(first: NonNegativeInt, after: String): RoutineSlotConnection!
  evening(first: NonNegativeInt, after: String): RoutineSlotConnection!
}

# Identifiable owner of one day/section Task list. Its id is the stable Relay
# store key that lets a reorder mutation write the new edge order in place.
type DaySectionSlots implements Node {
  id: ID!
  dayOfWeek: DayOfWeek!
  section: DaySection!
  slots(first: NonNegativeInt, after: String): RoutineSlotConnection!
}

type TaskConnection {
  edges: [TaskEdge!]!
  pageInfo: PageInfo!
}

type TaskEdge {
  node: Task!
  cursor: String!
}

type RoutineSlotConnection {
  edges: [RoutineSlotEdge!]!
  pageInfo: PageInfo!
}

type RoutineSlotEdge {
  node: RoutineSlot!
  cursor: String!
}

type TaskCompletionConnection {
  edges: [TaskCompletionEdge!]!
  pageInfo: PageInfo!
}

type TaskCompletionEdge {
  node: TaskCompletion!
  cursor: String!
}

type DailyTaskInstanceConnection {
  edges: [DailyTaskInstanceEdge!]!
  pageInfo: PageInfo!
}

type DailyTaskInstanceEdge {
  node: DailyTaskInstance!
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input UpdateTaskInput {
  taskId: ID!
  title: String
  icon: String
}

input CreateRoutineSlotInput {
  taskId: ID!
  dayOfWeek: DayOfWeek!
  section: DaySection!
}

input PushSubscriptionKeysInput {
  p256dh: String!
  auth: String!
}

input RegisterPushSubscriptionInput {
  endpoint: String!
  keys: PushSubscriptionKeysInput!
  platform: String
}

type CreateTaskPayload {
  taskEdge: TaskEdge!
}

type UpdateTaskPayload {
  task: Task!
}

type DeleteTaskPayload {
  deletedId: ID!
}

type CreateRoutineSlotPayload {
  routineSlotEdge: RoutineSlotEdge!
}

type DeleteRoutineSlotPayload {
  deletedId: ID!
}

type CompleteRoutineSlotPayload {
  taskCompletionEdge: TaskCompletionEdge!
}

type UncompleteRoutineSlotPayload {
  dailyTaskInstance: DailyTaskInstance!
  deletedId: ID!
}

type RegisterPushSubscriptionPayload {
  pushSubscription: PushSubscription!

  # The authenticated user's server-derived push state after this mutation. The
  # client renders reminders state from here instead of asserting it locally.
  me: User!
}

type RemovePushSubscriptionPayload {
  deletedId: ID!
  me: User!
}

type SendTestPushPayload {
  delivered: Boolean!
  message: String!

  # Set when the push service reported the subscription gone (HTTP 404/410) and
  # this server dropped the row, so the client can delete it from its store.
  deletedId: ID
  me: User!
}
